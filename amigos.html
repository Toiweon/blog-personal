<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  /* aplica tema e idioma guardados antes de pintar, para que no parpadee */
  try {
    if (localStorage.getItem('isaacTheme') === 'dark') document.documentElement.classList.add('dark');
    if (localStorage.getItem('isaacLang') === 'es') document.documentElement.setAttribute('lang', 'es');
  } catch (e) {}
</script>
</head>
<body id="top">
<div class="page">

  <header class="topbar">
    <nav class="nav" aria-label="Navigation">
      <a href="index.html" data-en="Home" data-es="Atrás">Home</a>
      <a href="index.html#about" data-en="About me" data-es="Sobre mí">About me</a>

      <button class="theme" id="themeToggle" type="button" aria-pressed="false">Dark mode</button>

    <section>

      <div class="friends">

        <div class="friend" style="--c:#009B7D; --rot:-1.2deg">
          <img src="img/mit.png" alt="Friend photo">
          <h3 data-en="Mitsu" data-es="Mitsu">Mirsu</h3>
          <p data-en="Untentionally funny but confusing at the same time" data-es="Graciosa inintencionadamente pero también misteriosa">oka</p>
        </div>

        <div class="friend" style="--c:#9A6B6B; --rot:1.4deg">
          <img src="img/nah.png" alt="Friend photo">

          <p data-en="Hola chicos adiós chicos" data-es="Hola chicos adiós chicos"></p>
        </div>

        <div class="friend" style="--c:#C22E2E; --rot:-0.8deg">
          <img src="img/eka.png" alt="Friend photo">
          <h3 data-en="Ekain" data-es="Ekain">AKAAAIN</h3>
          <p data-en="I like playing doubles with him in SSBU" data-es="Me gusta jugar 2vs2 en SSBU con él"></p>

        </div>

        <div class="friend" style="--c:#88221D; --rot:-1.4deg">
          <img src="img/raf.png" alt="Friend photo">
          <h3 data-en="Rafa" data-es="Rafa">Rafael</h3>
          <p data-en="Reserved and kinda introvert, makes beautiful art" data-es="Reservado y un poco introvertido, hace arte muy bonito"></p>
        </div>

        <div class="friend" style="--c:#6D8D53; --rot:0.9deg">
          <img src="img/pau.png" alt="Friend photo">
          <h3 data-en="Paula" data-es="Paula">Paula</h3>
          <p data-en="Ignore her picture, her character is strange. Cheerful, shouts a lot but it's funny" data-es="Ignora su foto, su personaje es un poco raro. Risueña, grita a menudo pero es gracioso"></p>
        </div>

        <div class="friend" style="--c:#A622A6; --rot:0.9deg">
          <img src="img/ale.png" alt="Friend photo">
          <h3 data-en="Alex" data-es="Álex">Alex</h3>
          <p data-en="Supportive and nice to be with, R.E.P.O goat" data-es="Comprensivo y se está bien con él, es el goat del R.E.P.O"></p>

  <footer class="footer">
    <a href="index.html" data-en="Back to home" data-es="Volver al inicio">Back to home</a>

</div>
